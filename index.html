<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waïma — Garde-robe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15130f;
    --surface:#1e1b15;
    --surface-2:#28241c;
    --border:#3a3427;
    --text:#f1ead9;
    --text-dim:#a89f8c;
    --text-faint:#726b5c;
    --accent:#c17f42;
    --accent-soft:rgba(193,127,66,.16);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  input,select,textarea,button{font-family:inherit;}
  a{color:var(--accent);}

  #login-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{width:100%;max-width:360px;}
  .brand{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-style:italic;
    font-size:2rem;
    letter-spacing:.01em;
    margin:0 0 2px;
  }
  .brand-sub{
    color:var(--text-dim);
    font-size:.82rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:0 0 32px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:.75rem;
    color:var(--text-dim);
    margin-bottom:6px;
    letter-spacing:.03em;
  }
  .field input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    color:var(--text);
    font-size:.95rem;
  }
  .field input:focus{outline:none;border-color:var(--accent);}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--accent);
    color:#1a1408;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  #login-error{color:#e07a5f;font-size:.82rem;margin-top:14px;min-height:1em;}

  #app-view{display:none;}
  header.topbar{
    position:sticky;top:0;z-index:10;
    background:rgba(21,19,15,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
  }
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .topbar-row h1{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:1.3rem;
    margin:0;
  }
  #signout-btn{background:none;border:none;color:var(--text-faint);font-size:.78rem;cursor:pointer;padding:4px;}
  #item-count{color:var(--text-dim);font-size:.78rem;margin-top:2px;}

  main{max-width:720px;margin:0 auto;padding:14px 16px 100px;}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .controls input[type="search"], .controls select{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:9px 12px;
    font-size:.85rem;
  }
  #search-input{flex:1 1 160px; min-width:0;}
  .controls select{flex:0 0 auto;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    border-radius:20px;
    padding:5px 12px;
    font-size:.76rem;
    cursor:pointer;
    user-select:none;
  }
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text);}

  .item{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 14px;
    margin-bottom:6px;
    cursor:pointer;
  }
  .item-head{display:flex;align-items:center;gap:12px;}
  .item-thumb{
    width:48px;height:48px;flex:0 0 48px;
    border-radius:8px;
    overflow:hidden;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
  }
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb-placeholder{
    font-family:'Fraunces',serif;
    font-style:italic;
    color:var(--text-faint);
    font-size:1.1rem;
  }
  .item-text{flex:1;min-width:0;}
  .detail-photo{
    width:100%;
    max-height:280px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:12px;
    display:block;
  }
  .item-title{font-weight:600;font-size:.92rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-sub{color:var(--text-dim);font-size:.78rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-score{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:1.15rem;
    color:var(--accent);
    white-space:nowrap;
  }
  .item-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .badge{font-size:.7rem;padding:3px 9px;border-radius:20px;font-weight:600;color:#15130f;}
  .pill{font-size:.7rem;padding:3px 8px;border-radius:5px;color:#15130f;font-weight:600;}
  .item-detail{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
    font-size:.82rem;
    color:var(--text-dim);
    line-height:1.55;
  }
  .item.expanded .item-detail{display:block;}
  .detail-row{margin-bottom:6px;}
  .detail-row strong{color:var(--text);font-weight:600;}
  .item-actions{display:flex;gap:8px;margin-top:14px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}

  #add-fab{
    position:fixed;right:20px;bottom:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:var(--accent);
    color:#1a1408;
    border:none;
    font-size:1.6rem;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    z-index:20;
  }
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,9,6,.7);
    z-index:30;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px 16px 0 0;
    width:100%;max-width:600px;max-height:88vh;
    overflow-y:auto;
    padding:20px;
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    margin:0 0 4px;
    font-size:1.2rem;
  }
  .modal p.hint{color:var(--text-dim);font-size:.8rem;margin:0 0 14px;}
  .modal textarea{
    width:100%;min-height:220px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:12px;
    font-size:.8rem;
    font-family:'IBM Plex Mono',monospace;
    line-height:1.5;
    resize:vertical;
  }
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions .btn{width:auto;flex:1;}
  #add-error{color:#e07a5f;font-size:.8rem;margin-top:10px;white-space:pre-wrap;}
  #add-preview{
    margin-top:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    font-size:.8rem;
    display:none;
  }
  #add-preview.show{display:block;}
  #add-preview div{margin-bottom:4px;}
  #toggle-format{
    background:none;border:none;color:var(--text-faint);
    font-size:.75rem;text-decoration:underline;cursor:pointer;padding:0;margin-top:8px;
  }
  #format-help{display:none;font-size:.74rem;color:var(--text-faint);margin-top:8px;line-height:1.6;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;}
  #format-help.show{display:block;}

  .filter-block{margin-bottom:18px;}
  .filter-label{
    display:block;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-faint);
    margin-bottom:8px;
  }
  .filter-block select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:9px 12px;
    font-size:.85rem;
  }
  .threshold-row{display:flex;gap:6px;}
  .thresh-btn{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:8px;
    padding:8px 0;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
  }
  .thresh-btn.active{background:var(--accent);border-color:var(--accent);color:#1a1408;}

  .form-section-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:.95rem;
    color:var(--accent);
    margin:20px 0 10px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .form-section-title:first-of-type{margin-top:4px;padding-top:0;border-top:none;}
  .filter-block input[type="text"], .filter-block input[type="number"], .filter-block textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:9px 12px;
    font-size:.85rem;
  }
  .filter-block input:focus, .filter-block select:focus, .filter-block textarea:focus{
    outline:none;border-color:var(--accent);
  }
  .checkbox-row{display:flex;flex-wrap:wrap;gap:12px;}
  .checkbox-row label{
    display:flex;align-items:center;gap:6px;
    font-size:.82rem;color:var(--text-dim);
    cursor:pointer;
  }
  .checkbox-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);}

  #version-footer{
    position:fixed;
    left:20px;bottom:20px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:.72rem;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    z-index:20;
  }
  #changelog-body{font-size:.84rem;line-height:1.6;color:var(--text-dim);}
  #changelog-body h3{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    color:var(--text);font-size:1rem;margin:20px 0 2px;
  }
  #changelog-body h3:first-child{margin-top:0;}
  #changelog-body .cl-date{color:var(--text-faint);font-size:.74rem;margin-bottom:8px;}
  #changelog-body h4{
    text-transform:uppercase;letter-spacing:.05em;font-size:.7rem;
    color:var(--accent);margin:10px 0 4px;font-weight:600;
  }
  #changelog-body ul{margin:0 0 4px;padding-left:18px;}
  #changelog-body li{margin-bottom:3px;}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <p class="brand">Waïma</p>
    <p class="brand-sub">Garde-robe · Lionel</p>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Se connecter</button>
      <p id="login-error"></p>
    </form>
  </div>
</div>

<div id="app-view">
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <h1>Waïma</h1>
        <p id="item-count"></p>
      </div>
      <button id="signout-btn">Déconnexion</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <input type="search" id="search-input" placeholder="Rechercher (libellé, marque, couleur…)">
      <select id="sort-select">
        <option value="score-desc">Score ↓</option>
        <option value="score-asc">Score ↑</option>
        <option value="frequence-desc">Fréquence ↓</option>
        <option value="attachement-desc">Attachement ↓</option>
        <option value="libelle-asc">Libellé A→Z</option>
      </select>
      <button class="btn-ghost" id="open-filters" style="border-radius:8px;padding:9px 14px;font-size:.85rem;cursor:pointer;">
        Filtres<span id="filter-badge" style="display:none;background:var(--accent);color:#1a1408;border-radius:10px;padding:1px 7px;font-size:.7rem;font-weight:700;margin-left:6px;"></span>
      </button>
    </div>

    <div id="items-container"></div>
  </main>

  <button id="add-fab" aria-label="Ajouter une pièce">+</button>
  <button id="version-footer">v1.8.0</button>
</div>

<div class="modal-overlay" id="changelog-overlay">
  <div class="modal">
    <h2>Historique des versions</h2>
    <p class="hint">Source de vérité : <a href="https://github.com/Jackmilkkaa/rep-WAIMA/blob/main/CHANGELOG.md" target="_blank" rel="noopener">CHANGELOG.md</a> sur GitHub.</p>
    <div id="changelog-body">Chargement…</div>
    <div class="modal-actions">
      <button class="btn" id="changelog-close">Fermer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="filter-overlay">
  <div class="modal">
    <h2>Filtres</h2>
    <p class="hint">Combine autant de critères que tu veux.</p>

    <div class="filter-block">
      <label class="filter-label">Catégorie</label>
      <select id="category-filter"><option value="">Toutes</option></select>
    </div>
    <div class="filter-block">
      <label class="filter-label">Sous-catégorie</label>
      <select id="sous-categorie-filter"><option value="">Toutes</option></select>
    </div>
    <div class="filter-block">
      <label class="filter-label">Marque</label>
      <select id="marque-filter"><option value="">Toutes</option></select>
    </div>
    <div class="filter-block">
      <label class="filter-label">Rôle</label>
      <div class="chips" id="role-chips"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">ADN dominant</label>
      <div class="chips" id="adn-chips"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">Texture</label>
      <div class="chips" id="texture-chips"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">Saison</label>
      <div class="chips" id="saison-chips"></div>
    </div>

    <div class="filter-block">
      <label class="filter-label">Formalité minimum</label>
      <div class="threshold-row" id="thresh-formalite"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">Fréquence minimum</label>
      <div class="threshold-row" id="thresh-frequence"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">Attachement minimum</label>
      <div class="threshold-row" id="thresh-attachement"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">Polyvalence minimum</label>
      <div class="threshold-row" id="thresh-polyvalence"></div>
    </div>
    <div class="filter-block">
      <label class="filter-label">Premium perçu minimum</label>
      <div class="threshold-row" id="thresh-premium"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="filters-reset">Réinitialiser</button>
      <button class="btn" id="filters-close">Fermer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="add-overlay">
  <div class="modal">
    <h2 id="add-modal-title">Ajouter une pièce</h2>
    <p class="hint" id="add-modal-hint">Renseigne les champs ci-dessous.</p>

    <form id="item-form">
      <div class="form-section-title" style="margin-top:0;padding-top:0;border-top:none;">Photo</div>
      <div class="filter-block">
        <div id="photo-preview-wrap">
          <img id="photo-preview" style="display:none;width:100%;max-height:220px;object-fit:cover;border-radius:8px;">
          <div id="photo-empty" style="display:flex;align-items:center;justify-content:center;height:120px;background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;color:var(--text-faint);font-size:.8rem;">Aucune photo</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <label class="btn btn-ghost" style="cursor:pointer;text-align:center;">
            Prendre une photo
            <input type="file" id="f-photo-camera" accept="image/*" capture="environment" style="display:none;">
          </label>
          <label class="btn btn-ghost" style="cursor:pointer;text-align:center;">
            Depuis la galerie
            <input type="file" id="f-photo-gallery" accept="image/*" style="display:none;">
          </label>
        </div>
        <p id="photo-status" style="font-size:.76rem;color:var(--text-faint);margin-top:6px;"></p>
      </div>

      <div class="form-section-title">Identité</div>
      <div class="filter-block">
        <label class="filter-label" for="f-id">ID *</label>
        <input type="text" id="f-id" placeholder="CAT-Couleur-Type-Marque" required>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-libelle">Libellé *</label>
        <input type="text" id="f-libelle" required>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-categorie">Catégorie</label>
        <select id="f-categorie"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-souscategorie">Sous-catégorie</label>
        <select id="f-souscategorie"><option value="">(aucune)</option></select>
        <input type="text" id="f-souscategorie-new" placeholder="Nouvelle sous-catégorie…" style="display:none;margin-top:6px;">
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-marque">Marque</label>
        <select id="f-marque"><option value="">—</option></select>
        <input type="text" id="f-marque-new" placeholder="Nouvelle marque…" style="display:none;margin-top:6px;">
      </div>

      <div class="form-section-title">Caractéristiques</div>
      <div class="filter-block">
        <label class="filter-label" for="f-couleur">Couleur principale</label>
        <input type="text" id="f-couleur">
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-matiere">Matière</label>
        <input type="text" id="f-matiere">
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-texture">Texture</label>
        <input type="text" id="f-texture" list="texture-options" placeholder="Lisse, Texturée, Maille…">
        <datalist id="texture-options"></datalist>
      </div>
      <div class="filter-block">
        <label class="filter-label">Saison</label>
        <div class="checkbox-row" id="f-saison-group">
          <label><input type="checkbox" value="4 saisons"> 4 saisons</label>
          <label><input type="checkbox" value="Chaud"> Chaud</label>
          <label><input type="checkbox" value="Froid"> Froid</label>
          <label><input type="checkbox" value="Mi-saison"> Mi-saison</label>
        </div>
        <input type="text" id="f-saison-autre" placeholder="Autre (séparé par des virgules)" style="margin-top:6px;">
      </div>

      <div class="form-section-title">Évaluation</div>
      <div class="filter-block">
        <label class="filter-label" for="f-role">Rôle</label>
        <select id="f-role"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-formalite">Formalité</label>
        <select id="f-formalite"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-frequence">Fréquence</label>
        <select id="f-frequence"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-attachement">Attachement</label>
        <select id="f-attachement"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-polyvalence">Polyvalence</label>
        <select id="f-polyvalence"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-premium">Premium perçu</label>
        <select id="f-premium"><option value="">—</option></select>
      </div>
      <div class="filter-block">
        <label class="filter-label" for="f-score">Score (/10)</label>
        <input type="number" id="f-score" step="0.1" min="0" max="10">
      </div>

      <div class="form-section-title">ADN</div>
      <div class="filter-block">
        <label class="filter-label" for="f-adn-dom">ADN dominant</label>
        <select id="f-adn-dom"><option value="">—</option></select>
      </div>

        <label class="filter-label" for="f-intensite-sec">Intensité secondaire (0-100)</label>
        <input type="number" id="f-intensite-sec" min="0" max="100">

      <div class="form-section-title">Description</div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://dqqsggolhfoehmjeibxp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_uqQleZZwiJAUXqB35KpRJQ_FQftz87j';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

let allItems = [];
let activeRoles = new Set();
let activeAdn = new Set();
let activeTexture = new Set();
let activeSaison = new Set();
let thresholds = { formalite:0, frequence:0, attachement:0, polyvalence:0, premium_percu:0 };
let rolesRef = [];
let adnRef = [];

let currentUserId = null;

async function checkSession(){
  const { data:{ session } } = await supabase.auth.getSession();
  if(session){ currentUserId = session.user.id; showApp(); } else { showLogin(); }
}

function showLogin(){
  $('#login-view').style.display = 'flex';
  $('#app-view').style.display = 'none';
}
function showApp(){
  $('#login-view').style.display = 'none';
  $('#app-view').style.display = 'block';
  loadReferenceData().then(loadItems);
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#login-error').textContent = '';
  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){
    $('#login-error').textContent = "Connexion impossible : " + error.message;
    return;
  }
  currentUserId = data.user.id;
  showApp();
});

$('#signout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  showLogin();
});

async function loadReferenceData(){
  const { data: roles } = await supabase.from('roles').select('*').order('ordre');
  rolesRef = roles || [];
  const { data: adn } = await supabase.from('adn').select('*');
  adnRef = adn || [];

  for(const key of ['formalite','frequence','attachement','polyvalence','premium']){
    const table = 'echelle_' + key;
    const { data: rows } = await supabase.from(table).select('*').order('valeur');
    echelleRef[key] = rows || [];
  }
  const { data: cats } = await supabase.from('categories').select('*');
  allCategories = cats || [];
  const { data: marques } = await supabase.from('marques').select('*').order('nom');
  allMarques = marques || [];

  const chipContainer = $('#role-chips');
  chipContainer.innerHTML = '';
  activeRoles = new Set(rolesRef.filter(r => r.code !== 'retraite').map(r => r.code));
  rolesRef.forEach(r => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeRoles.has(r.code) ? ' active' : '');
    chip.textContent = r.libelle;
    chip.dataset.code = r.code;
    chip.addEventListener('click', () => {
      if(activeRoles.has(r.code)){ activeRoles.delete(r.code); chip.classList.remove('active'); }
      else { activeRoles.add(r.code); chip.classList.add('active'); }
      render(); updateFilterBadge();
    });
    chipContainer.appendChild(chip);
  });

  const adnContainer = $('#adn-chips');
  adnContainer.innerHTML = '';
  adnRef.forEach(a => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = a.libelle;
    chip.dataset.code = a.code;
    chip.addEventListener('click', () => {
      if(activeAdn.has(a.code)){ activeAdn.delete(a.code); chip.classList.remove('active'); }
      else { activeAdn.add(a.code); chip.classList.add('active'); }
      render(); updateFilterBadge();
    });
    adnContainer.appendChild(chip);
  });
  setupThresholds();
}

async function loadItems(){
  const { data, error } = await supabase
    .from('wardrobe_items')
    .select(`
      *,
      categorie:categories(categorie, sous_categorie),
      marque:marques(nom),
      role:roles(code, libelle, couleur),
      adn_dom:adn!wardrobe_items_adn_dominant_code_fkey(libelle, couleur, registre),
      adn_sec:adn!wardrobe_items_adn_secondaire_code_fkey(libelle, couleur, registre),
      f_formalite:echelle_formalite(libelle, couleur),
      f_frequence:echelle_frequence(libelle, couleur),
      f_attachement:echelle_attachement(libelle, couleur),
      f_polyvalence:echelle_polyvalence(libelle, couleur),
      f_premium:echelle_premium(libelle, couleur)
    `);
  if(error){
    $('#items-container').innerHTML = `<div class="empty-state">Erreur de chargement : ${error.message}</div>`;
    return;
  }
  allItems = data || [];
  populateCategoryFilter();
  populateMarqueFilter();
  populateTextureChips();
  populateSaisonChips();
  populateFormReferenceData();
  render();
}

function populateMarqueFilter(){
  const sel = $('#marque-filter');
  sel.innerHTML = '<option value="">Toutes</option>';
  const marques = new Set();
  allItems.forEach(it => { if(it.marque) marques.add(it.marque.nom); });
  [...marques].sort().forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    sel.appendChild(opt);
  });
}

function populateTextureChips(){
  const container = $('#texture-chips');
  container.innerHTML = '';
  const textures = new Set();
  allItems.forEach(it => { if(it.texture) textures.add(it.texture); });
  [...textures].sort().forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = t;
    chip.addEventListener('click', () => {
      if(activeTexture.has(t)){ activeTexture.delete(t); chip.classList.remove('active'); }
      else { activeTexture.add(t); chip.classList.add('active'); }
      render(); updateFilterBadge();
    });
    container.appendChild(chip);
  });
}

function populateSaisonChips(){
  const container = $('#saison-chips');
  container.innerHTML = '';
  const saisons = new Set();
  allItems.forEach(it => { (it.saison||[]).forEach(s => saisons.add(s)); });
  [...saisons].sort().forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s;
    chip.addEventListener('click', () => {
      if(activeSaison.has(s)){ activeSaison.delete(s); chip.classList.remove('active'); }
      else { activeSaison.add(s); chip.classList.add('active'); }
      render(); updateFilterBadge();
    });
    container.appendChild(chip);
  });
}

function setupThresholds(){
  ['formalite','frequence','attachement','polyvalence','premium_percu'].forEach(key => {
    const domId = key === 'premium_percu' ? 'thresh-premium' : 'thresh-' + key;
    const row = document.getElementById(domId);
    row.innerHTML = '';
    for(let v=1; v<=5; v++){
      const btn = document.createElement('button');
      btn.className = 'thresh-btn';
      btn.textContent = '≥' + v;
      btn.addEventListener('click', () => {
        thresholds[key] = (thresholds[key] === v) ? 0 : v;
        [...row.children].forEach(c => c.classList.remove('active'));
        if(thresholds[key] === v) btn.classList.add('active');
        render(); updateFilterBadge();
      });
      row.appendChild(btn);
    }
  });
}

function populateCategoryFilter(){
  const sel = $('#category-filter');
  sel.innerHTML = '<option value="">Toutes</option>';
  const cats = new Set();
  allItems.forEach(it => { if(it.categorie) cats.add(it.categorie.categorie); });
  [...cats].sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  populateSousCategorieFilter();
}

function populateSousCategorieFilter(){
  const sel = $('#sous-categorie-filter');
  const currentCat = $('#category-filter').value;
  sel.innerHTML = '<option value="">Toutes</option>';
  const subs = new Set();
  allItems.forEach(it => {
    if(!it.categorie || !it.categorie.sous_categorie) return;
    if(currentCat && it.categorie.categorie !== currentCat) return;
    subs.add(it.categorie.sous_categorie);
  });
  [...subs].sort().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function getFiltered(){
  const q = $('#search-input').value.trim().toLowerCase();
  const cat = $('#category-filter').value;
  const sousCat = $('#sous-categorie-filter').value;
  const marque = $('#marque-filter').value;
  let items = allItems.filter(it => {
    if(cat && (!it.categorie || it.categorie.categorie !== cat)) return false;
    if(sousCat && (!it.categorie || it.categorie.sous_categorie !== sousCat)) return false;
    if(marque && (!it.marque || it.marque.nom !== marque)) return false;
    if(activeRoles.size > 0 && !activeRoles.has(it.role_code)) return false;
    if(activeAdn.size > 0 && !activeAdn.has(it.adn_dominant_code)) return false;
    if(activeTexture.size > 0 && !activeTexture.has(it.texture)) return false;
    if(activeSaison.size > 0 && !(it.saison||[]).some(s => activeSaison.has(s))) return false;
    if(thresholds.formalite && (it.formalite||0) < thresholds.formalite) return false;
    if(thresholds.frequence && (it.frequence||0) < thresholds.frequence) return false;
    if(thresholds.attachement && (it.attachement||0) < thresholds.attachement) return false;
    if(thresholds.polyvalence && (it.polyvalence||0) < thresholds.polyvalence) return false;
    if(thresholds.premium_percu && (it.premium_percu||0) < thresholds.premium_percu) return false;
    if(q){
      const hay = [it.libelle, it.marque?.nom, it.couleur_principale, it.matiere, it.description_ia]
        .filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const sortVal = $('#sort-select').value;
  const [field, dir] = sortVal.split('-');
  items.sort((a,b) => {
    let av, bv;
    if(field === 'score'){ av = a.score ?? -1; bv = b.score ?? -1; }
    else if(field === 'frequence'){ av = a.frequence ?? -1; bv = b.frequence ?? -1; }
    else if(field === 'attachement'){ av = a.attachement ?? -1; bv = b.attachement ?? -1; }
    else if(field === 'libelle'){ av = a.libelle.toLowerCase(); bv = b.libelle.toLowerCase(); }
    if(av < bv) return dir === 'asc' ? -1 : 1;
    if(av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  return items;
}

function pill(refObj, value){
  if(!refObj) return '';
  return `<span class="pill" style="background:${refObj.couleur}" title="${refObj.libelle}">${value}</span>`;
}

function render(){
  const items = getFiltered();
  $('#item-count').textContent = `${items.length} pièce${items.length>1?'s':''}`;
  const container = $('#items-container');
  if(items.length === 0){
    container.innerHTML = `<div class="empty-state">Aucune pièce ne correspond aux filtres.</div>`;
    return;
  }
  container.innerHTML = items.map(it => {
    const catLabel = it.categorie ? (it.categorie.sous_categorie ? `${it.categorie.categorie} · ${it.categorie.sous_categorie}` : it.categorie.categorie) : '—';
    const roleBadge = it.role ? `<span class="badge" style="background:${it.role.couleur}">${it.role.libelle}</span>` : '';
    const adnDomBadge = it.adn_dom ? `<span class="badge" style="background:${it.adn_dom.couleur};color:#f1ead9">${it.adn_dom.libelle}</span>` : '';
    const saisonTxt = Array.isArray(it.saison) ? it.saison.join(', ') : '';

    return `
    <div class="item" data-id="${it.id}" style="border-left:4px solid ${it.role ? it.role.couleur : 'var(--border)'};">
      <div class="item-head">
        <div class="item-thumb">${it.photo_url ? `<img src="${it.photo_url}" alt="">` : `<span class="thumb-placeholder">${escapeHtml((it.libelle||'?').charAt(0))}</span>`}</div>
        <div class="item-text">
          <div class="item-title">${escapeHtml(it.libelle)}</div>
          <div class="item-sub">${escapeHtml(it.marque?.nom || '—')} · ${escapeHtml(catLabel)}</div>
        </div>
        <div class="item-score">${it.score != null ? Number(it.score).toFixed(1) : '—'}</div>
      </div>
      <div class="item-detail">
        ${it.photo_url ? `<img class="detail-photo" src="${it.photo_url}" alt="">` : ''}
        <div class="item-badges">
          ${roleBadge}
          ${adnDomBadge}
          ${pill(it.f_formalite, 'Formalité '+it.formalite)}
          ${pill(it.f_frequence, 'Fréquence '+it.frequence)}
          ${pill(it.f_attachement, 'Attachement '+it.attachement)}
          ${pill(it.f_polyvalence, 'Polyvalence '+it.polyvalence)}
          ${pill(it.f_premium, 'Premium '+it.premium_percu)}
        </div>
        <div class="detail-row"><strong>Couleur :</strong> ${escapeHtml(it.couleur_principale || '—')}</div>
        <div class="detail-row"><strong>Matière :</strong> ${escapeHtml(it.matiere || '—')}</div>
        <div class="detail-row"><strong>Texture :</strong> ${escapeHtml(it.texture || '—')}</div>
        <div class="detail-row"><strong>Saison :</strong> ${escapeHtml(saisonTxt || '—')}</div>
        ${it.adn_sec ? `<div class="detail-row"><strong>ADN secondaire :</strong> ${escapeHtml(it.adn_sec.libelle)} (${it.intensite_secondaire})</div>` : ''}
        ${it.intensite_dominant != null ? `<div class="detail-row"><strong>Intensité ADN dominant :</strong> ${it.intensite_dominant}</div>` : ''}
        <div class="detail-row"><strong>ID :</strong> ${escapeHtml(it.id)}</div>
        ${it.description_ia ? `<div class="detail-row" style="margin-top:8px;">${escapeHtml(it.description_ia)}</div>` : ''}
        <div class="item-actions">
          <button class="btn-ghost item-edit-btn" data-id="${escapeHtml(it.id)}" style="border-radius:8px;padding:8px 14px;font-size:.8rem;cursor:pointer;">Modifier</button>
          <button class="btn-ghost item-delete-btn" data-id="${escapeHtml(it.id)}" style="border-radius:8px;padding:8px 14px;font-size:.8rem;cursor:pointer;color:#e07a5f;border-color:#5a3a30;">Supprimer</button>
        </div>
      </div>
    </div>`;
  }).join('');

  $$('.item').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('expanded'));
  });

  $$('.item-edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = allItems.find(x => x.id === btn.dataset.id);
      if(item) openEditModal(item);
    });
  });

  $$('.item-delete-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const item = allItems.find(x => x.id === btn.dataset.id);
      if(!item) return;
      if(!confirm(`Supprimer définitivement "${item.libelle}" ? Cette action est irréversible.`)) return;
      const { error } = await supabase.from('wardrobe_items').delete().eq('id', item.id);
      if(error){ alert('Erreur à la suppression : ' + error.message); return; }
      await loadItems();
    });
  });
}

function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('#search-input').addEventListener('input', render);
$('#category-filter').addEventListener('change', () => { populateSousCategorieFilter(); render(); updateFilterBadge(); });
$('#sous-categorie-filter').addEventListener('change', () => { render(); updateFilterBadge(); });
$('#marque-filter').addEventListener('change', () => { render(); updateFilterBadge(); });
$('#sort-select').addEventListener('change', render);

$('#open-filters').addEventListener('click', () => $('#filter-overlay').classList.add('open'));
$('#filters-close').addEventListener('click', () => $('#filter-overlay').classList.remove('open'));
$('#filters-reset').addEventListener('click', () => {
  activeAdn.clear(); activeTexture.clear(); activeSaison.clear();
  activeRoles = new Set(rolesRef.filter(r => r.code !== 'retraite').map(r => r.code));
  Object.keys(thresholds).forEach(k => thresholds[k] = 0);
  $('#category-filter').value = '';
  $('#sous-categorie-filter').value = '';
  populateSousCategorieFilter();
  $('#marque-filter').value = '';
  $$('#adn-chips .chip, #texture-chips .chip, #saison-chips .chip, .thresh-btn').forEach(c => c.classList.remove('active'));
  $$('#role-chips .chip').forEach(c => c.classList.toggle('active', activeRoles.has(c.dataset.code)));
  render(); updateFilterBadge();
});

function isDefaultRoles(){
  const nonRetraite = rolesRef.filter(r => r.code !== 'retraite').map(r => r.code);
  return activeRoles.size === nonRetraite.length && nonRetraite.every(c => activeRoles.has(c));
}

function updateFilterBadge(){
  let count = 0;
  if($('#category-filter').value) count++;
  if($('#sous-categorie-filter').value) count++;
  if($('#marque-filter').value) count++;
  if(!isDefaultRoles()) count++;
  count += activeAdn.size + activeTexture.size + activeSaison.size;
  count += Object.values(thresholds).filter(v => v > 0).length;
  const badge = $('#filter-badge');
  if(count > 0){ badge.style.display = 'inline'; badge.textContent = count; }
  else { badge.style.display = 'none'; }
}

const overlay = $('#add-overlay');
let editingId = null;
let currentPhotoUrl = null;
let allCategories = [];
let allMarques = [];
let echelleRef = {};

function setPhoto(url){
  currentPhotoUrl = url || null;
  const img = $('#photo-preview'), empty = $('#photo-empty');
  if(currentPhotoUrl){ img.src = currentPhotoUrl; img.style.display = 'block'; empty.style.display = 'none'; }
  else { img.style.display = 'none'; empty.style.display = 'flex'; }
  $('#photo-status').textContent = '';
}

async function uploadPhoto(file){
  if(!file || !currentUserId) return;
  $('#photo-status').textContent = 'Envoi en cours…';
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${currentUserId}/${Date.now()}.${ext}`;
  const { error } = await supabase.storage.from('wardrobe-photos').upload(path, file, { upsert: true });
  if(error){
    $('#photo-status').textContent = "Erreur d'envoi : " + error.message;
    return;
  }
  const { data } = supabase.storage.from('wardrobe-photos').getPublicUrl(path);
  setPhoto(data.publicUrl);
  $('#photo-status').textContent = 'Photo ajoutée.';
}

$('#f-photo-camera').addEventListener('change', (e) => uploadPhoto(e.target.files[0]));
$('#f-photo-gallery').addEventListener('change', (e) => uploadPhoto(e.target.files[0]));

function populateSelect(sel, options, placeholder){
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
}

function populateFormReferenceData(){
  populateSelect($('#f-role'), rolesRef.map(r => ({value:r.code, label:r.libelle})), '—');
  populateSelect($('#f-adn-dom'), adnRef.map(a => ({value:a.code, label:a.libelle})), '—');
  populateSelect($('#f-adn-sec'), adnRef.map(a => ({value:a.code, label:a.libelle})), '(aucun)');

  ['formalite','frequence','attachement','polyvalence','premium'].forEach(key => {
    const selId = key === 'premium' ? 'f-premium' : 'f-' + key;
    const opts = (echelleRef[key] || []).map(e => ({value:e.valeur, label:`${e.valeur} — ${e.libelle}`}));
    populateSelect($('#' + selId), opts, '—');
  });

  const catNames = [...new Set(allCategories.map(c => c.categorie))].sort();
  populateSelect($('#f-categorie'), catNames.map(c => ({value:c, label:c})), '—');

  const marqueOpts = allMarques.map(m => ({value:m.nom, label:m.nom}));
  marqueOpts.push({value:'__new__', label:'+ Nouvelle marque…'});
  populateSelect($('#f-marque'), marqueOpts, '—');

  const textures = [...new Set(allItems.map(it => it.texture).filter(Boolean))].sort();
  $('#texture-options').innerHTML = textures.map(t => `<option value="${t}">`).join('');
}

function populateSousCategorieOptions(categorieName, selectedValue){
  const sel = $('#f-souscategorie');
  const subs = allCategories.filter(c => c.categorie === categorieName && c.sous_categorie).map(c => c.sous_categorie).sort();
  const opts = subs.map(s => ({value:s, label:s}));
  opts.push({value:'__new__', label:'+ Nouvelle sous-catégorie…'});
  populateSelect(sel, opts, '(aucune)');
  sel.value = selectedValue && subs.includes(selectedValue) ? selectedValue : '';
  $('#f-souscategorie-new').style.display = 'none';
}

$('#f-categorie').addEventListener('change', () => populateSousCategorieOptions($('#f-categorie').value, ''));
$('#f-souscategorie').addEventListener('change', () => {
  $('#f-souscategorie-new').style.display = $('#f-souscategorie').value === '__new__' ? 'block' : 'none';
});
$('#f-marque').addEventListener('change', () => {
  $('#f-marque-new').style.display = $('#f-marque').value === '__new__' ? 'block' : 'none';
});

function resetForm(){
  $('#item-form').reset();
  $('#f-id').disabled = false;
  $('#f-souscategorie-new').style.display = 'none';
  $('#f-marque-new').style.display = 'none';
  populateSousCategorieOptions('', '');
  setPhoto(null);
  $('#add-error').textContent = '';
}

$('#add-fab').addEventListener('click', () => {
  editingId = null;
  $('#add-modal-title').textContent = 'Ajouter une pièce';
  $('#add-modal-hint').textContent = "Renseigne les champs ci-dessous.";
  $('#add-submit').textContent = 'Ajouter';
  resetForm();
  overlay.classList.add('open');
});
$('#add-cancel').addEventListener('click', () => overlay.classList.remove('open'));

function openEditModal(it){
  editingId = it.id;
  $('#add-modal-title').textContent = 'Modifier';
  $('#add-modal-hint').textContent = it.libelle;
  $('#add-submit').textContent = 'Enregistrer les modifications';
  $('#add-error').textContent = '';
  setPhoto(it.photo_url);

  $('#f-id').value = it.id;
  $('#f-id').disabled = true;
  $('#f-libelle').value = it.libelle || '';
  $('#f-categorie').value = it.categorie?.categorie || '';
  populateSousCategorieOptions(it.categorie?.categorie || '', it.categorie?.sous_categorie || '');
  const marqueExists = allMarques.some(m => m.nom === it.marque?.nom);
  $('#f-marque').value = marqueExists ? (it.marque?.nom || '') : (it.marque ? '__new__' : '');
  $('#f-marque-new').style.display = (!marqueExists && it.marque) ? 'block' : 'none';
  if(!marqueExists && it.marque) $('#f-marque-new').value = it.marque.nom;

  $('#f-couleur').value = it.couleur_principale || '';
  $('#f-matiere').value = it.matiere || '';
  $('#f-texture').value = it.texture || '';

  const knownSaisons = ['4 saisons','Chaud','Froid','Mi-saison'];
  const itemSaisons = it.saison || [];
  $$('#f-saison-group input[type=checkbox]').forEach(cb => { cb.checked = itemSaisons.includes(cb.value); });
  $('#f-saison-autre').value = itemSaisons.filter(s => !knownSaisons.includes(s)).join(', ');

  $('#f-role').value = it.role_code || '';
  $('#f-formalite').value = it.formalite ?? '';
  $('#f-frequence').value = it.frequence ?? '';
  $('#f-attachement').value = it.attachement ?? '';
  $('#f-polyvalence').value = it.polyvalence ?? '';
  $('#f-premium').value = it.premium_percu ?? '';
  $('#f-score').value = it.score ?? '';

  $('#f-adn-dom').value = it.adn_dominant_code || '';
  $('#f-intensite-dom').value = it.intensite_dominant ?? '';
  $('#f-adn-sec').value = it.adn_secondaire_code || '';
  $('#f-intensite-sec').value = it.intensite_secondaire ?? '';

  $('#f-description').value = it.description_ia || '';

  overlay.classList.add('open');
}

async function resolveCategorieId(){
  const categorie = $('#f-categorie').value;
  if(!categorie) return null;
  let sousCategorie = $('#f-souscategorie').value;
  if(sousCategorie === '__new__') sousCategorie = $('#f-souscategorie-new').value.trim();
  sousCategorie = sousCategorie || null;

  const existing = allCategories.find(c => c.categorie === categorie && c.sous_categorie === sousCategorie);
  if(existing) return existing.id;

  const { data, error } = await supabase.from('categories').insert({ categorie, sous_categorie: sousCategorie }).select('id').single();
  if(error) throw new Error('Catégorie : ' + error.message);
  allCategories.push({ id:data.id, categorie, sous_categorie: sousCategorie });
  return data.id;
}

async function resolveMarqueId(){
  let marque = $('#f-marque').value;
  if(marque === '__new__') marque = $('#f-marque-new').value.trim();
  if(!marque) return null;

  const existing = allMarques.find(m => m.nom === marque);
  if(existing) return existing.id;

  const { data, error } = await supabase.from('marques').insert({ nom: marque }).select('id').single();
  if(error) throw new Error('Marque : ' + error.message);
  allMarques.push({ id:data.id, nom:marque });
  return data.id;
}

$('#item-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#add-error').textContent = '';

  const id = $('#f-id').value.trim();
  const libelle = $('#f-libelle').value.trim();
  if(!id || !libelle){
    $('#add-error').textContent = 'ID et Libellé sont obligatoires.';
    return;
  }

  let categorie_id, marque_id;
  try {
    categorie_id = await resolveCategorieId();
    marque_id = await resolveMarqueId();
  } catch(err){
    $('#add-error').textContent = err.message;
    return;
  }

  const saison = [
    ...$$('#f-saison-group input[type=checkbox]:checked').map(cb => cb.value),
    ...$('#f-saison-autre').value.split(',').map(s=>s.trim()).filter(Boolean)
  ];

  const payload = {
    libelle,
    categorie_id, marque_id,
    photo_url: currentPhotoUrl,
    couleur_principale: $('#f-couleur').value.trim() || null,
    matiere: $('#f-matiere').value.trim() || null,
    texture: $('#f-texture').value.trim() || null,
    formalite: $('#f-formalite').value ? parseInt($('#f-formalite').value) : null,
    saison: saison.length ? saison : null,
    frequence: $('#f-frequence').value ? parseInt($('#f-frequence').value) : null,
    attachement: $('#f-attachement').value ? parseInt($('#f-attachement').value) : null,
    role_code: $('#f-role').value || null,
    adn_dominant_code: $('#f-adn-dom').value || null,
    intensite_dominant: $('#f-intensite-dom').value ? parseInt($('#f-intensite-dom').value) : null,
    adn_secondaire_code: $('#f-adn-sec').value || null,
    intensite_secondaire: $('#f-intensite-sec').value ? parseInt($('#f-intensite-sec').value) : null,
    polyvalence: $('#f-polyvalence').value ? parseInt($('#f-polyvalence').value) : null,
    premium_percu: $('#f-premium').value ? parseInt($('#f-premium').value) : null,
    score: $('#f-score').value ? parseFloat($('#f-score').value) : null,
    description_ia: $('#f-description').value.trim() || null,
  };

  let error;
  if(editingId){
    ({ error } = await supabase.from('wardrobe_items').update(payload).eq('id', editingId));
  } else {
    ({ error } = await supabase.from('wardrobe_items').insert({ id, ...payload }));
  }
  if(error){
    $('#add-error').textContent = "Erreur à l'enregistrement : " + error.message;
    return;
  }
  overlay.classList.remove('open');
  editingId = null;
  await loadItems();
});

$('#version-footer').addEventListener('click', async () => {
  $('#changelog-overlay').classList.add('open');
  const body = $('#changelog-body');
  body.textContent = 'Chargement…';
  try {
    const res = await fetch('https://raw.githubusercontent.com/Jackmilkkaa/rep-WAIMA/main/CHANGELOG.md?t=' + Date.now());
    const md = await res.text();
    body.innerHTML = renderChangelog(md);
  } catch(err){
    body.textContent = "Impossible de charger le changelog : " + err.message;
  }
});
$('#changelog-close').addEventListener('click', () => $('#changelog-overlay').classList.remove('open'));

function renderChangelog(md){
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  for(const line of lines){
    if(line.startsWith('## [')){
      if(inList){ html += '</ul>'; inList = false; }
      const m = line.match(/^## \[([^\]]+)\] - (.+)$/);
      if(m) html += `<h3>${escapeHtml(m[1])}</h3><div class="cl-date">${escapeHtml(m[2])}</div>`;
    } else if(line.startsWith('### ')){
      if(inList){ html += '</ul>'; inList = false; }
      html += `<h4>${escapeHtml(line.slice(4))}</h4>`;
    } else if(line.startsWith('- ')){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${escapeHtml(line.slice(2))}</li>`;
    } else if(line.startsWith('# ') || line.startsWith('Toutes') || line.startsWith('Ce fichier')){
      // skip titre principal et intro
    }
  }
  if(inList) html += '</ul>';
  return html || '<p>Changelog vide.</p>';
}

checkSession();
